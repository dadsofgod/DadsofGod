<script>
(function(){
  var PRICES={'DOG-TEE':35,'DOG-LS':45,'DOG-HOOD':65,'DOG-CAP':35};
  function read(){
    var cart=[];
    try{cart=JSON.parse(localStorage.getItem('dogCart')||'[]')}catch(e){cart=[]}
    if(!Array.isArray(cart))cart=[];
    return cart.filter(function(i){return i&&PRICES[i.sku]}).map(function(i){
      return {sku:i.sku,name:i.name,price:PRICES[i.sku],size:i.sku==='DOG-CAP'?'One size':i.size,quantity:i.quantity||1};
    });
  }
  function save(cart){localStorage.setItem('dogCart',JSON.stringify(cart));updateCartCount(cart)}
  function updateCartCount(cart){var el=document.getElementById('cart-count');if(el)el.textContent=String((cart||read()).length)}
  function esc(t){return String(t==null?'':t).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
  window.showCart=function(){
    var cart=read();
    var box=document.getElementById('cart-items');
    var foot=document.getElementById('cart-footer');
    box.innerHTML='';
    if(!cart.length){
      box.innerHTML='<div class="text-center py-10 text-zinc-400">Your cart is empty</div><div class="text-center"><a class="text-[#FDD10C] font-semibold" href="/index.html#shop">Shop</a></div>';
      foot.classList.add('hidden');
    }else{
      cart.forEach(function(item,index){
        box.innerHTML+='<div class="flex justify-between items-center border-b border-zinc-800 pb-4"><div><div class="font-semibold">'+esc(item.name)+'</div><div class="text-sm text-zinc-400">Size '+esc(item.size)+'</div></div><div class="text-right"><div class="font-bold">$'+item.price+'</div><button type="button" onclick="removeFromCart('+index+')" class="text-xs text-red-400">Remove</button></div></div>';
      });
      foot.classList.remove('hidden');
    }
    updateCartCount(cart);
    document.getElementById('cart-modal').classList.remove('hidden');
  };
  window.hideCart=function(){document.getElementById('cart-modal').classList.add('hidden')};
  window.removeFromCart=function(i){var cart=read();cart.splice(i,1);save(cart);showCart()};
  document.addEventListener('keydown',function(e){if(e.key==='Escape')hideCart()});
  window.addEventListener('storage',function(e){if(e.key==='dogCart')updateCartCount(read())});
  window.addEventListener('pageshow',function(){updateCartCount(read())});
  updateCartCount(read());
})();
</script>
<script>
(function () {
  var ACTION = 'a, button, input, select, textarea, summary, [role="button"], [role="menuitem"]';
  function target(e) {
    var node = e.target;
    return node && node.closest ? node : null;
  }
  function panels() {
    return Array.prototype.slice.call(document.querySelectorAll('[data-dropdown]'));
  }
  function buttonFor(panel) {
    if (!panel.id) return null;
    return document.querySelector('[data-dropdown-toggle][aria-controls="' + panel.id + '"]');
  }
  function isOpen(panel) {
    return !panel.classList.contains('hidden');
  }
  function setOpen(panel, open) {
    panel.classList.toggle('hidden', !open);
    var btn = buttonFor(panel);
    if (btn) btn.setAttribute('aria-expanded', open ? 'true' : 'false');
  }
  function closePanel(panel, restoreFocus) {
    var wasOpen = isOpen(panel);
    setOpen(panel, false);
    if (restoreFocus && wasOpen) {
      var btn = buttonFor(panel);
      if (btn && panel.contains(document.activeElement)) btn.focus();
    }
  }
  function closeAll(restoreFocus) {
    panels().forEach(function (panel) { closePanel(panel, restoreFocus); });
  }
  panels().forEach(function (panel) { setOpen(panel, isOpen(panel)); });
  document.addEventListener('click', function (e) {
    var node = target(e);
    if (!node) return;
    var toggle = node.closest('[data-dropdown-toggle]');
    if (toggle) {
      var panel = document.getElementById(toggle.getAttribute('aria-controls') || '');
      if (!panel || !panel.hasAttribute('data-dropdown')) return;
      var next = !isOpen(panel);
      panels().forEach(function (other) { if (other !== panel) setOpen(other, false); });
      setOpen(panel, next);
      return;
    }
    var panel = node.closest('[data-dropdown]');
    if (panel) {
      var action = node.closest(ACTION);
      if (action && panel.contains(action)) setOpen(panel, false);
      return;
    }
    closeAll(false);
  });
  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    if (!panels().some(isOpen)) return;
    closeAll(true);
  });
})();
</script>
